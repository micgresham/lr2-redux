[env:esp32dev]
; Pinned deliberately (2026-08-23). The pioarduino platform that [env:esp32c6]
; needs installs itself under the name "espressif32" too, so a bare
; `platform = espressif32` silently starts resolving to it - which swaps this
; build from Arduino core 2.0.17 to 3.3.11 with no warning and grows the image
; by ~180KB. This is the firmware running on the installed unit; it stays on
; the core it was built and hardware-verified against.
platform = espressif32@7.0.1
board = mhetesp32minikit
framework = arduino
monitor_speed = 115200
upload_port =  /dev/cu.usbserial-026BSRQ9
board_build.filesystem = littlefs
; Keeps web/ -> data/ in sync on every build, and chains uploadfs onto
; upload - see scripts/build_web.py for why and the fallback behavior when
; Node isn't installed on this machine.
board_build.f_cpu = 160000000L

extra_scripts = pre:scripts/build_web.py
build_src_filter =
    +<*>
    -<diagnostic_main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.5
    ESP32Async/ESPAsyncWebServer@^3.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BROWNOUT_DET=0 

; BUILD THIS ONE WITH `scripts/pio-c6`, NOT plain `pio run -e esp32c6`.
; The pioarduino platform below installs itself under the name "espressif32" -
; the same name the classic ESP32 envs use - and both platforms declare a
; package called framework-arduinoespressif32, so in a shared core dir they
; overwrite each other's Arduino core. The wrapper points this env at its own
; PLATFORMIO_CORE_DIR so the two can't collide; see the header comment there.
;
; ESP32-C6 SuperMini port target (added 2026-08-23). Same production firmware
; as [env:esp32dev] - only the pin map differs, and that's selected by IDF
; target inside include/pins.h, so there's nothing to switch by hand.
;
; The official espressif32 platform cannot build for the C6 at all (it's pinned
; to Arduino core 2.0.17 / IDF 4.4, which predates the chip), hence the
; pioarduino fork below - that's Arduino core 3.3.11 / IDF 5.5.5.
;
; This board has no USB-UART bridge; the serial console is native USB CDC,
; which is what ARDUINO_USB_CDC_ON_BOOT enables. Without it every Serial.printf
; in this project - the boot reason, the WiFi attempt log, the 30s heartbeat -
; goes nowhere.
;
; Brownout: the classic build disables the detector via a register write in
; main.cpp, which has no C6 equivalent (see the guard there). To disable it
; here, add `custom_sdkconfig = CONFIG_ESP_BROWNOUT_DET=n` - note that forces a
; full IDF rebuild, so it's left off by default.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Bigger OTA slots than the stock 1.25MB - the core 3.x image doesn't fit
; otherwise. See the header comment in partitions_c6.csv.
board_build.partitions = partitions_c6.csv

extra_scripts = pre:scripts/build_web.py
build_src_filter =
    +<*>
    -<diagnostic_main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.5
    ESP32Async/ESPAsyncWebServer@^3.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone hardware bring-up tool - see src/diagnostic_main.cpp. Separate
; from [env:esp32dev] so it can't accidentally end up in a production build;
; it has its own setup()/loop() and would collide with main.cpp's if both
; were compiled into the same environment.
[env:diagnostic]
platform = espressif32@7.0.1 ; pinned for the same reason as [env:esp32dev] above
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-026BSRQ9

build_src_filter =
    +<*>
    -<main.cpp>
    -<config.cpp>
    -<config_api.cpp>
    -<setup_portal.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.5
    ESP32Async/ESPAsyncWebServer@^3.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BROWNOUT_DET=0

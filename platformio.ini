[env:esp32dev]
platform = espressif32
board = mhetesp32minikit
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-02YO6Y61
board_build.filesystem = littlefs
; Keeps web/ -> data/ in sync on every build, and chains uploadfs onto
; upload - see scripts/build_web.py for why and the fallback behavior when
; Node isn't installed on this machine.
board_build.f_cpu = 160000000L

extra_scripts = pre:scripts/build_web.py
build_src_filter =
    +<*>
    -<diagnostic_main.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.5
    ESP32Async/ESPAsyncWebServer@^3.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BROWNOUT_DET=0 

; Standalone hardware bring-up tool - see src/diagnostic_main.cpp. Separate
; from [env:esp32dev] so it can't accidentally end up in a production build;
; it has its own setup()/loop() and would collide with main.cpp's if both
; were compiled into the same environment.
[env:diagnostic]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
build_src_filter =
    +<*>
    -<main.cpp>
    -<config.cpp>
    -<config_api.cpp>
    -<setup_portal.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    ESP32Async/AsyncTCP@^3.2.5
    ESP32Async/ESPAsyncWebServer@^3.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=3
